<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Welcome Gateway Login-Test</title>
</head>
<body>
    <main>
        <h1>Welcome Gateway Login-Test</h1>
        <p>Lokale Gateway-Administrator-Zugangsdaten eingeben, nicht MyBuildings-Zugangsdaten.</p>
        <p>Port 443 verwendet HTTPS mit ungeprüftem Zertifikat. Andere Ports verwenden unverschlüsseltes HTTP.</p>
        <p>Passwort und Sitzung werden nicht gespeichert oder protokolliert.</p>
        <form id="gateway-form" autocomplete="off">
            <p><label for="gatewayIp">Gateway IPv4-Adresse</label><br>
                <input id="gatewayIp" name="gatewayIp" required></p>
            <p><label for="gatewayPort">Gateway-Port</label><br>
                <input id="gatewayPort" name="gatewayPort" type="number" min="1" max="65535" value="443" required></p>
            <p><label for="username">Benutzername</label><br>
                <input id="username" name="username" value="admin" required></p>
            <p><label for="password">Passwort</label><br>
                <input id="password" name="password" type="password" required></p>
            <button type="submit">Anmeldung testen</button>
        </form>
        <p id="result" role="status" aria-live="polite"></p>
        <pre id="details"></pre>
    </main>
    <script src="/app.js" defer></script>
</body>
</html>
