<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Busch-Jaeger Welcome - Settings</title>
    <link rel="stylesheet" href="../../lib/css/jquery-ui.min.css" />
    <link rel="stylesheet" href="../../css/adapter.css" />
    <style>
        body { padding: 20px; }
        h4 { margin-top: 25px; margin-bottom: 15px; font-weight: 500; color: #333; }
        .input-wrapper { margin-bottom: 20px; }
        label { display: block; margin-bottom: 5px; color: #333 !important; font-weight: 500; }
        input { width: 100%; padding: 8px; border: 1px solid #ccc; color: #000 !important; background: #fff !important; box-sizing: border-box; }
        input:focus { border-color: #2196f3; outline: none; box-shadow: 0 0 3px rgba(33, 150, 243, 0.3); }
        .buttons { margin-top: 30px; display: flex; gap: 10px; }
        .btn { padding: 10px 20px; border: none; border-radius: 2px; cursor: pointer; font-size: 14px; }
        .btn-primary { background-color: #2196f3; color: #fff; }
        .btn-primary:hover { background-color: #1976d2; }
        .btn-secondary { background-color: #f5f5f5; color: #333; border: 1px solid #ddd; }
        .btn-secondary:hover { background-color: #e0e0e0; }
        body.dark h4 { color: #fff; }
        body.dark label { color: #ccc !important; }
        body.dark input { color: #fff !important; background-color: #555 !important; border-color: #666; }
        body.dark input:focus { border-color: #64b5f6; box-shadow: 0 0 3px rgba(100, 181, 246, 0.3); }
        body.dark .btn-secondary { background-color: #333; color: #fff; border-color: #555; }
        body.dark .btn-secondary:hover { background-color: #444; }
    </style>
</head>
<body>
    <h4>Gateway Settings</h4>
    <div class="input-wrapper">
        <label for="gatewayIp">Gateway IP</label>
        <input type="text" id="gatewayIp" class="value" />
    </div>
    <div class="input-wrapper">
        <label for="gatewayPort">Port</label>
        <input type="number" id="gatewayPort" class="value" min="1" max="65535" />
    </div>
    <div class="input-wrapper">
        <label for="username">Username</label>
        <input type="text" id="username" class="value" />
    </div>
    <div class="input-wrapper">
        <label for="password">Password</label>
        <input type="password" id="password" class="value" />
    </div>

    <h4>Advanced Settings</h4>
    <div class="input-wrapper">
        <label for="sipPort">SIP Port</label>
        <input type="number" id="sipPort" class="value" min="1" max="65535" />
    </div>
    <div class="input-wrapper">
        <label for="pollInterval">Poll Interval</label>
        <input type="number" id="pollInterval" class="value" min="5" max="3600" />
    </div>
    <div class="input-wrapper">
        <label for="doorOpenDuration">Ring Duration</label>
        <input type="number" id="doorOpenDuration" class="value" min="1" max="60" />
    </div>

    <div class="buttons">
        <button class="btn btn-primary" onclick="window.save()">Save</button>
        <button class="btn btn-primary" onclick="window.saveClose()">Save & Close</button>
        <button class="btn btn-secondary" onclick="window.cancel()">Cancel</button>
    </div>

    <script src="../../lib/js/jquery-3.2.1.min.js"></script>
    <script src="../../lib/js/jquery-ui.min.js"></script>
    <script>
        console.log('=== ADMIN PAGE LOADED (jQuery UI) ===');

        window.load = function (settings, onDone) {
            console.log('load called', settings);
            $('#gatewayIp').val(settings.gatewayIp || '');
            $('#gatewayPort').val(settings.gatewayPort || 80);
            $('#username').val(settings.username || '');
            $('#password').val(settings.password || '');
            $('#sipPort').val(settings.sipPort || 5060);
            $('#pollInterval').val(settings.pollInterval || 30);
            $('#doorOpenDuration').val(settings.doorOpenDuration || 5);
            $('.value').on('change', function() { window.onChange(); });
            if (onDone) onDone();
        };

        window.onChange = function () {
            console.log('onChange called');
        };

        window.save = function (callback) {
            console.log('save called');
            const obj = {
                gatewayIp: $('#gatewayIp').val() || '',
                gatewayPort: parseInt($('#gatewayPort').val()) || 80,
                username: $('#username').val() || '',
                password: $('#password').val() || '',
                sipPort: parseInt($('#sipPort').val()) || 5060,
                pollInterval: parseInt($('#pollInterval').val()) || 30,
                doorOpenDuration: parseInt($('#doorOpenDuration').val()) || 5
            };
            console.log('Saving:', obj);
            if (typeof sendTo === 'function') {
                console.log('Calling sendTo');
                sendTo(null, 'save', obj, callback);
            } else {
                console.log('sendTo not found');
                if (callback) callback();
            }
        };

        window.saveClose = function () {
            window.save(function() {
                if (typeof window.parent !== 'undefined' && window.parent !== window) {
                    window.parent.postMessage({type: 'close'}, '*');
                }
            });
        };

        window.cancel = function () {
            if (typeof window.parent !== 'undefined' && window.parent !== window) {
                window.parent.postMessage({type: 'close'}, '*');
            }
        };

        $(document).ready(function () {
            console.log('Ready. jQuery:', typeof $);
        });
    </script>
</body>
</html>
