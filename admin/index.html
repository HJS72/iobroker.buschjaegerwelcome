<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Busch-Jaeger Welcome - Settings</title>
    <link rel="stylesheet" href="../../lib/css/jquery-ui.min.css" />
    <link rel="stylesheet" href="../../css/adapter.css" />
    <style>
        body {
            padding: 20px;
            background-color: #fff;
        }
        h4 {
            margin-top: 25px;
            margin-bottom: 15px;
            font-weight: 500;
            color: #000;
            font-size: 1.2em;
        }
        .input-wrapper {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #000 !important;
            font-weight: 500;
        }
        input[type="text"],
        input[type="password"],
        input[type="number"] {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            color: #000 !important;
            background-color: #fff !important;
            box-sizing: border-box;
        }
        input:focus {
            border-color: #2196f3;
        }
        .section {
            margin-bottom: 30px;
        }
    </style>
</head>
<body>
    <div class="section">
        <h4>Gateway Settings</h4>
        <div class="input-wrapper">
            <label for="gatewayIp" data-i18n="gateway_ip">Gateway IP Address</label>
            <input type="text" id="gatewayIp" class="value" />
        </div>
        <div class="input-wrapper">
            <label for="gatewayPort" data-i18n="gateway_port">Gateway Port</label>
            <input type="number" id="gatewayPort" class="value" min="1" max="65535" />
        </div>
        <div class="input-wrapper">
            <label for="username" data-i18n="username">Username</label>
            <input type="text" id="username" class="value" />
        </div>
        <div class="input-wrapper">
            <label for="password" data-i18n="password">Password</label>
            <input type="password" id="password" class="value" />
        </div>
    </div>

    <div class="section">
        <h4>Advanced Settings</h4>
        <div class="input-wrapper">
            <label for="sipPort" data-i18n="sip_port">SIP Port</label>
            <input type="number" id="sipPort" class="value" min="1" max="65535" />
        </div>
        <div class="input-wrapper">
            <label for="pollInterval" data-i18n="poll_interval">Poll Interval</label>
            <input type="number" id="pollInterval" class="value" min="5" max="3600" />
        </div>
        <div class="input-wrapper">
            <label for="doorOpenDuration" data-i18n="door_open_duration">Ring Duration</label>
            <input type="number" id="doorOpenDuration" class="value" min="1" max="60" />
        </div>
    </div>

    <script src="../../lib/js/jquery-3.2.1.min.js"></script>
    <script src="../../lib/js/jquery-ui.min.js"></script>
    <script src="../../js/translate.js"></script>
    <script src="../../lib/js/socket.io.js"></script>
    <script>
        let settings = {};

        function load(s, onDone) {
            settings = s;
            $('#gatewayIp').val(s.gatewayIp || '');
            $('#gatewayPort').val(s.gatewayPort || 80);
            $('#username').val(s.username || '');
            $('#password').val(s.password || '');
            $('#sipPort').val(s.sipPort || 5060);
            $('#pollInterval').val(s.pollInterval || 30);
            $('#doorOpenDuration').val(s.doorOpenDuration || 5);
            if (onDone) onDone();
        }

        function save(callback) {
            const newSettings = {
                gatewayIp: $('#gatewayIp').val() || '',
                gatewayPort: parseInt($('#gatewayPort').val()) || 80,
                username: $('#username').val() || '',
                password: $('#password').val() || '',
                sipPort: parseInt($('#sipPort').val()) || 5060,
                pollInterval: parseInt($('#pollInterval').val()) || 30,
                doorOpenDuration: parseInt($('#doorOpenDuration').val()) || 5
            };
            if (typeof sendTo === 'function') {
                sendTo(null, 'save', newSettings, callback);
            } else if (callback) {
                callback();
            }
        }

        $(document).ready(function () {
            if (typeof translateAll === 'function') {
                translateAll();
            }
        });
    </script>
</body>
</html>
