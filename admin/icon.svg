<?xml version="1.0" encoding="UTF-8"?>
<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Gateway background -->
  <rect x="15" y="20" width="70" height="60" rx="5" fill="#e8f4f8" stroke="#0288d1" stroke-width="2"/>
  
  <!-- Door icon -->
  <rect x="25" y="35" width="30" height="40" fill="#ffd54f" stroke="#333" stroke-width="1.5"/>
  <circle cx="52" cy="55" r="3" fill="#333"/>
  
  <!-- Doorbell indicator -->
  <circle cx="75" cy="40" r="10" fill="#ff6f00"/>
  <text x="75" y="45" text-anchor="middle" font-size="12" font-weight="bold" fill="white">🔔</text>
  
  <!-- SIP wave indicator -->
  <path d="M 50 75 Q 55 70 60 75" stroke="#0288d1" stroke-width="1.5" fill="none"/>
  <path d="M 48 80 Q 55 73 62 80" stroke="#0288d1" stroke-width="1.5" fill="none" opacity="0.6"/>
</svg>
